<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --azul: #ee4d2d;
      --verde: #1c9c5b;
      --amarelo: #d99a00;
      --cinza: #6b7280;
      --bg: #f4f5f7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 16px;
      color: #1f2430;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--cinza); font-size: 13px; margin-bottom: 16px; }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    label { font-size: 12px; color: var(--cinza); display:block; margin-bottom: 4px; }
    select, input[type=text] {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      border: 1px solid #d8dbe0;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    input#brInput { font-size: 22px; text-align:center; letter-spacing: 1px; }

    button {
      font-size: 16px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: var(--azul);
      color: #fff;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }

    .status-linha { display:flex; align-items:center; gap:8px; font-size: 13px; margin-bottom: 10px; }
    .bolinha { width:8px; height:8px; border-radius:50%; background: var(--cinza); }
    .bolinha.ok { background: var(--verde); }
    .bolinha.erro { background: #d64545; }

    .sugestao {
      border: 1px solid #e3e5e9;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .sugestao.top { border-color: var(--verde); background: #f2fbf6; }
    .sugestao .linha1 { display:flex; justify-content:space-between; font-weight:600; }
    .sugestao .linha2 { font-size: 12px; color: var(--cinza); margin-top: 2px; }
    .tag {
      display:inline-block; font-size: 11px; font-weight:600; padding: 2px 6px;
      border-radius: 6px; background:#eef1f5; color:#444; margin-right: 4px;
    }
    .tag.mesa { background:#fff3e0; color:#a05a00; }
    .tag.criterio-GEO { background:#e6f6ec; color:#177a45; }
    .tag.criterio-BAIRRO { background:#e8f0fe; color:#1a56b3; }
    .tag.criterio-CEP { background:#fdf1e0; color:#a15c00; }
    .tag.criterio-CLUSTER { background:#f1eafe; color:#6a2fb3; }

    .resultado { text-align:center; }
    .resultado .ok-icone { font-size: 40px; }
    .resultado h2 { margin: 8px 0 2px; }
    .mensagem-erro { background:#fdeceb; color:#a3271b; border-radius:8px; padding:10px; font-size: 13px; margin-bottom: 10px; }
    .mensagem-info { background:#eef1f5; color:#333; border-radius:8px; padding:10px; font-size: 13px; margin-bottom: 10px; }

    #etiqueta {
      border: 2px dashed #999;
      padding: 14px;
      font-family: monospace;
      font-size: 13px;
      margin-top: 10px;
    }
    #etiqueta .grande { font-size: 26px; font-weight: 700; }
    .oculto { display:none; }

    @media print {
      body * { visibility: hidden; }
      #etiqueta, #etiqueta * { visibility: visible; }
      #etiqueta { position: absolute; top:0; left:0; border: none; }
    }
  </style>
</head>
<body>

  <h1>📦 Realocador EHA</h1>
  <div class="sub">Bipe o BR do pacote que não coube na rota original.</div>

  <div class="card">
    <label for="hubSelect">Hub</label>
    <select id="hubSelect"></select>
    <div class="status-linha">
      <div id="cookieBolinha" class="bolinha"></div>
      <span id="cookieTexto">verificando cookie do hub…</span>
    </div>

    <label for="brInput">BR do pacote (SPX TN)</label>
    <input type="text" id="brInput" placeholder="BR..." autofocus autocomplete="off">
    <button id="buscarBtn" onclick="buscarSugestoes()">Buscar rota</button>
  </div>

  <div id="areaSugestoes" class="oculto"></div>
  <div id="areaResultado" class="oculto"></div>

  <script>
    var HUBS_CACHE = [];
    var estadoAtual = null; // { br, station, candidatos, original }

    document.getElementById('brInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') buscarSugestoes();
    });

    google.script.run.withSuccessHandler(function(hubs) {
      HUBS_CACHE = hubs;
      var sel = document.getElementById('hubSelect');
      sel.innerHTML = hubs.map(function(h) {
        return '<option value="' + h.id + '"' + (h.id === 10047 ? ' selected' : '') + '>' + h.nome + ' (' + h.id + ')</option>';
      }).join('');
      atualizarStatusCookie();
    }).getHubsList();

    document.getElementById('hubSelect').addEventListener('change', atualizarStatusCookie);

    function stationAtual() {
      return parseInt(document.getElementById('hubSelect').value, 10);
    }

    function atualizarStatusCookie() {
      var bolinha = document.getElementById('cookieBolinha');
      var texto = document.getElementById('cookieTexto');
      bolinha.className = 'bolinha';
      texto.textContent = 'verificando cookie do hub…';
      google.script.run.withSuccessHandler(function(r) {
        bolinha.className = 'bolinha ' + (r.ok ? 'ok' : 'erro');
        texto.textContent = r.ok ? ('cookie OK — ' + r.hub) : ('sem cookie configurado para ' + r.hub + ' — use o menu "⚡ Realocador EHA" na planilha');
      }).statusCookieHub(stationAtual());
    }

    function limparAreas() {
      document.getElementById('areaSugestoes').classList.add('oculto');
      document.getElementById('areaSugestoes').innerHTML = '';
      document.getElementById('areaResultado').classList.add('oculto');
      document.getElementById('areaResultado').innerHTML = '';
    }

    function buscarSugestoes() {
      var br = document.getElementById('brInput').value.trim();
      if (!br) return;
      limparAreas();
      var btn = document.getElementById('buscarBtn');
      btn.disabled = true;
      btn.textContent = 'Buscando...';

      google.script.run
        .withSuccessHandler(function(res) { btn.disabled = false; btn.textContent = 'Buscar rota'; mostrarSugestoes(br, res); })
        .withFailureHandler(function(err) { btn.disabled = false; btn.textContent = 'Buscar rota'; mostrarErro(err.message || String(err)); })
        .getSugestoesEha(br, stationAtual());
    }

    function mostrarErro(msg) {
      var area = document.getElementById('areaResultado');
      area.classList.remove('oculto');
      area.innerHTML = '<div class="card"><div class="mensagem-erro">❌ ' + msg + '</div></div>';
    }

    function mostrarSugestoes(br, res) {
      if (!res.ok) { mostrarErro(res.error); return; }

      estadoAtual = { br: br, station: stationAtual(), candidatos: res.candidatos, original: res.original };
      var area = document.getElementById('areaSugestoes');
      area.classList.remove('oculto');

      if (!res.candidatos.length) {
        area.innerHTML = '<div class="card"><div class="mensagem-info">⚠️ Sem rota disponível pra esse pacote agora (origem: '
          + res.original.at + ' / ' + res.original.cage + '). Fica retido — já registrei essa pendência.</div></div>';
        return;
      }

      var html = '<div class="card"><div class="sub">Origem: ' + res.original.at + ' (' + res.original.cage + ') — ' + res.original.cluster + '</div>';
      res.candidatos.forEach(function(c, i) {
        html += '<div class="sugestao' + (i === 0 ? ' top' : '') + '" onclick="confirmarAlocacao(' + i + ')">'
          + '<div class="linha1"><span>' + c.at + ' — ' + c.cage + '</span><span>' + (i === 0 ? '⭐ melhor opção' : '') + '</span></div>'
          + '<div class="linha2">'
          + '<span class="tag criterio-' + c.criterio + '">' + c.criterio + '</span>'
          + (c.mesa ? '<span class="tag mesa">MESA ' + c.mesa + '</span>' : '')
          + (c.statusDoca ? '<span class="tag">' + c.statusDoca + '</span>' : '')
          + c.cluster + ' · motorista: ' + (c.driver || '—')
          + '</div></div>';
      });
      html += '</div>';
      area.innerHTML = html;
    }

    function confirmarAlocacao(indice) {
      if (!estadoAtual) return;
      var candidato = estadoAtual.candidatos[indice];
      document.getElementById('areaSugestoes').innerHTML += '<div class="card"><button disabled>Alocando em ' + candidato.at + '...</button></div>';

      google.script.run
        .withSuccessHandler(mostrarResultadoAlocacao)
        .withFailureHandler(function(err) { mostrarErro(err.message || String(err)); })
        .alocarEha(estadoAtual.br, candidato.at, estadoAtual.station, '');
    }

    function mostrarResultadoAlocacao(res) {
      document.getElementById('areaSugestoes').classList.add('oculto');
      var area = document.getElementById('areaResultado');
      area.classList.remove('oculto');

      if (!res.ok) {
        area.innerHTML = '<div class="card"><div class="mensagem-erro">❌ ' + res.error + '</div>'
          + '<button class="secundario" onclick="buscarSugestoes()">Tentar de novo</button></div>';
        return;
      }

      var et = res.etiqueta;
      area.innerHTML = '<div class="card resultado">'
        + '<div class="ok-icone">✅</div>'
        + '<h2>Alocado em ' + res.atDestino + '</h2>'
        + '<div class="sub">Corredor/Gaiola ' + res.cageDestino + (res.mesa ? ' · MESA ' + res.mesa : '') + ' · ' + res.cluster + '</div>'
        + '<div id="etiqueta">'
        + '  <div>CORREDOR/GAIOLA</div><div class="grande">' + et.corredorGaiola + '</div>'
        + '  <div style="margin-top:8px">AT: ' + et.at + '</div>'
        + '  <div>HUB: ' + et.hub + '</div>'
        + '  <div>DATA: ' + et.data + ' ' + et.hora + '</div>'
        + '  <div>BR: ' + et.br + '</div>'
        + '</div>'
        + '<button onclick="window.print()">🖨️ Imprimir etiqueta</button>'
        + '<button class="secundario" onclick="proximoPacote()">Próximo pacote</button>'
        + '</div>';
    }

    function proximoPacote() {
      limparAreas();
      var input = document.getElementById('brInput');
      input.value = '';
      input.focus();
    }
  </script>
</body>
</html>
